[workspace]
members = [
    "crates/*",
    "apps/*",
    "tools/*"
]
resolver = "3"

[workspace.dependencies]
iam = { path = "crates/iam" }
communities = { path = "crates/communities" }
shared = { path = "crates/shared" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
