[workspace]
members = [
    "app",
    "contexts/*",
    "tools/*",
]
resolver = "3"

[workspace.dependencies]
iam = { path = "contexts/iam" }
communities = { path = "contexts/communities" }
shared = { path = "shared" }
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Árbol B: `panic!`/`expect("invariante: …")` solo para invariantes rotos.
# `unwrap` no dice cuál invariante se rompió.
unwrap_used = "deny"
